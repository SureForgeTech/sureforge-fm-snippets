name: Snippet parity check

on:
  pull_request:
    paths:
      - 'data/**'
      - 'FileMaker_Functions.alfredsnippets'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/snippet-parity.yml'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'FileMaker_Functions.alfredsnippets'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/snippet-parity.yml'

permissions:
  contents: read

concurrency:
  group: snippet-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover tests
      - name: Check CSV and bundle parity
        run: python tools/build-bundle.py --check
